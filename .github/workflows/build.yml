name: Crear APK de Android

on:
  push:
    branches: [ main, principal ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Fix SDL2_image dav1d submodule issue
      run: |
        # Localiza la ruta de SDL2_image si ya existe en el caché y corrige el submódulo huérfano
        SDLIMG=".buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/bootstrap_builds/sdl2/jni/SDL2_image"
        if [ -d "$SDLIMG" ]; then
          echo "Limpiando submódulo corrupto dav1d..."
          rm -rf "$SDLIMG/external/dav1d"
          git -C "$SDLIMG" submodule deinit -f external/dav1d || true
        fi

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: bin/*.apk
