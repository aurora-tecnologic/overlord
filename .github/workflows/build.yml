name: Crear APK de Android

on:
  push:
    branches:
      - main
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            ccache

      - name: Configurar variables de compilación
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.cache/buildozer"
          mkdir -p "$HOME/.buildozer"

          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "cython==0.29.36" \
            "buildozer==1.5.0" \
            "virtualenv"

      - name: Verificar entorno
        run: |
          python --version
          pip --version
          buildozer --version
          cython --version
          java -version
          git --version

      - name: Limpiar compilaciones anteriores
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p .buildozer
          mkdir -p bin

      - name: Compilar APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          buildozer -v android debug

      - name: Mostrar APK generado
        if: success()
        run: |
          echo "=== APK GENERADO ==="
          find bin -maxdepth 1 -type f -name "*.apk" -print

      - name: Subir APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: overlord-debug-apk
          path: bin/*.apk
          if-no-files-found: error
