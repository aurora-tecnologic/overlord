name: Crear APK de Android

on:
  push:
    branches:
      - main
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Limpiar builds anteriores
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Compilar APK con Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer -v android debug
          repository_root: .
          workdir: .
          buildozer_version: stable

      - name: Comprobar APK generado
        run: |
          echo "=== APK GENERADO ==="
          find . -type f -name "*.apk" -print

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: overlord-debug-apk
          path: |
            bin/*.apk
            .buildozer/android/platform/build-*/dists/*/build/outputs/apk/**/*.apk
          if-no-files-found: error
