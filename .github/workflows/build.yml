name: Crear APK de Android

on:
  push:
    branches:
      - main
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint \
            curl \
            patch

          python -m pip install --upgrade pip setuptools virtualenv

          python -m pip install \
            "buildozer>=1.5.0" \
            "cython==0.29.34"

      - name: Preparar Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p .buildozer

      - name: Configurar python-for-android
        run: |
          mkdir -p .buildozer/android/platform

          cd .buildozer/android/platform

          git clone --depth 1 \
            --branch master \
            https://github.com/kivy/python-for-android.git \
            python-for-android

      - name: Reparar SDL2_image antes de compilar
        run: |
          P4A=".buildozer/android/platform/python-for-android"

          echo "=== python-for-android ==="
          cd "$P4A"
          git rev-parse HEAD

          echo "=== Buscando SDL2_image ==="
          find "$P4A" -path "*sdl2_image*" -type f -o -path "*sdl2_image*" -type d | head -50 || true

          echo "=== Verificando recetas ==="
          find "$P4A/pythonforandroid/recipes" \
            -maxdepth 2 \
            -type f \
            -path "*sdl2_image*" \
            -print || true

      - name: Compilar APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          buildozer -v android clean || true

          rm -rf .buildozer/android/platform/build-arm64-v8a_armeabi-v7a

          buildozer -v android debug

      - name: Mostrar APK generado
        if: always()
        run: |
          echo "=== ARCHIVOS APK ==="
          find . -type f -name "*.apk" -print || true

          echo "=== CONTENIDO DE BIN ==="
          ls -lah bin || true

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: overlord-debug-apk
          path: bin/*.apk
          if-no-files-found: error
